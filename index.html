<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITCOE Smart Campus Navigation System</title>
    
    <!-- Google Fonts - Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- App Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
    <body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-logo-title">
                <div class="logo-container">
                    <img src="logo.png" alt="SIT Logo" class="college-logo-img">
                </div>
                <div class="title-details">
                    <p class="trust-title">Shri Shamrao Patil Yadravkar Educational & Charitable Trust's</p>
                    <h1 class="college-title">SHARAD INSTITUTE OF TECHNOLOGY COLLEGE OF ENGINEERING</h1>
                    <p class="navigation-subtitle">Smart Campus Navigation System</p>
                </div>
            </div>
        </header>

        <!-- Search Bar Component -->
        <div class="search-section">
            <div class="search-wrapper">
                <div class="search-input-box">
                    <svg viewBox="0 0 24 24" class="search-icon"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg>
                    <input type="text" id="searchInput" placeholder="Search classrooms, labs, faculty, departments..." autocomplete="off">
                    <button class="btn-clear" id="btnClearSearch" style="display: none;">&times;</button>
                </div>
                <button class="btn-mic" id="btnVoiceSearch" title="Voice Search/Navigation">
                    <svg viewBox="0 0 24 24" class="mic-icon"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z" fill="currentColor"/></svg>
                </button>
            </div>
            <!-- Search Results Suggestions Dropdown -->
            <div class="search-suggestions" id="searchSuggestions"></div>
        </div>

        <!-- Live GPS Connection bar -->
        <div class="status-panel">
            <div class="gps-status-indicator" id="gpsStatusContainer">
                <span class="status-dot pulsing-yellow" id="gpsDot"></span>
                <span id="trackingStatus">Initializing campus positioning...</span>
            </div>
        </div>

        <!-- Department Selection Section -->
        <section class="dept-section">
            <h2 class="section-title">Select Department</h2>
            <div class="dept-grid" id="deptContainer">
                <button class="dept-card cse" id="btn-dept-CSE" onclick="selectDepartment('CSE')">
                    <div class="dept-icon">💻</div>
                    <div class="dept-info">
                        <h3>CSE</h3>
                        <p>Computer Science</p>
                    </div>
                </button>
                <button class="dept-card mech" id="btn-dept-MECH" onclick="selectDepartment('MECH')">
                    <div class="dept-icon">⚙️</div>
                    <div class="dept-info">
                        <h3>MECH</h3>
                        <p>Mechanical Eng.</p>
                    </div>
                </button>
                <button class="dept-card civil" id="btn-dept-Civil" onclick="selectDepartment('Civil')">
                    <div class="dept-icon">🏗️</div>
                    <div class="dept-info">
                        <h3>CIVIL</h3>
                        <p>Civil Eng.</p>
                    </div>
                </button>
                <button class="dept-card electrical" id="btn-dept-Electrical" onclick="selectDepartment('Electrical')">
                    <div class="dept-icon">⚡</div>
                    <div class="dept-info">
                        <h3>ELECTRICAL</h3>
                        <p>Electrical Eng.</p>
                    </div>
                </button>
                <button class="dept-card ece" id="btn-dept-ECE" onclick="selectDepartment('ECE')">
                    <div class="dept-icon">🔌</div>
                    <div class="dept-info">
                        <h3>ECE</h3>
                        <p>Electronics & Comp.</p>
                    </div>
                </button>
                <button class="dept-card architecture" id="btn-dept-AR" onclick="selectDepartment('AR')">
                    <div class="dept-icon">🏛️</div>
                    <div class="dept-info">
                        <h3>AR</h3>
                        <p>Architecture</p>
                    </div>
                </button>
                <button class="dept-card aids" id="btn-dept-AIDS" onclick="selectDepartment('AIDS')">
                    <div class="dept-icon">🤖</div>
                    <div class="dept-info">
                        <h3>AIDS</h3>
                        <p>AI & Data Science</p>
                    </div>
                </button>
                <button class="dept-card library" id="btn-dept-Library" onclick="selectDepartment('Library')">
                    <div class="dept-icon">📚</div>
                    <div class="dept-info">
                        <h3>LIBRARY</h3>
                        <p>Central Library</p>
                    </div>
                </button>
                <button class="dept-card admin" id="btn-dept-Admin" onclick="selectDepartment('Admin')">
                    <div class="dept-icon">💼</div>
                    <div class="dept-info">
                        <h3>ADMIN</h3>
                        <p>Admin & Executive</p>
                    </div>
                </button>
            </div>
        </section>
